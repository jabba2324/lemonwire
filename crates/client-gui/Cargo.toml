[package]
name = "lemonwire-client-gui"
description = "Lemon Wire desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lemonwire-gui"
path = "src/main.rs"

[dependencies]
lemonwire-client-core = { workspace = true, features = ["librqbit"] }
lemonwire-proto.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
egui-phosphor = "0.14"
egui-notify = "0.23"
rfd = "0.17"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
tempfile.workspace = true
lemonwire-server.workspace = true
