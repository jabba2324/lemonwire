[package]
name = "lemonwire-client-core"
description = "Lemon Wire client core: commands, profiles, key storage, API client and torrent engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The librqbit torrent engine. Without it, core builds with only the engine trait.
librqbit = ["dep:librqbit"]

[dependencies]
lemonwire-proto.workspace = true
argon2.workspace = true
async-trait.workspace = true
chacha20poly1305.workspace = true
directories.workspace = true
futures.workspace = true
librqbit = { workspace = true, optional = true, features = ["rust-tls"] }
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true
url.workspace = true
getrandom.workspace = true

[dev-dependencies]
lemonwire-server.workspace = true
tempfile.workspace = true

[[test]]
name = "e2e"
required-features = ["librqbit"]
